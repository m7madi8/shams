# نشر تلقائي إلى Vercel عند كل push على main
# إذا لم يظهر Deployments في Vercel بعد الربط بـ GitHub، فعّل هذا الـ workflow:
# 1) Vercel → Account Settings → Tokens → Create
# 2) Vercel → مشروع shams → Settings → General: انسخ Project ID و Team (Org) ID
# 3) GitHub → m7madi8/shams → Settings → Secrets → Actions:
#    VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod
          working-directory: ./
